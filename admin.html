<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>HALFDAY · 工具管理</title><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" defer></script></head><body><main>
<header><div><small>HALFDAY BAKERY</small><h1>提示词工具管理</h1></div><a href="/" target="_blank" rel="noopener">查看公开工具 ↗</a></header>
<form id="login"><label for="token">管理口令</label><input id="token" type="password" autocomplete="current-password" required><p>口令仅在本页内存中使用。关闭或刷新后需重新输入。</p><button>进入管理</button></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="workspace" hidden>
<nav><button id="reload" type="button">重新载入</button><button id="export" type="button">导出提示词修改</button><button id="logout" type="button">退出</button><span id="revision"></span></nav>
<section><h2>修改提示词</h2><p>选择分类与条目，修改后点击发布。会自动保存上一版，访客刷新页面即可看到。此处修改的是全站预设。</p><div class="selectors"><div><label for="group">分类</label><select id="group"></select></div><div><label for="item">条目</label><select id="item"></select></div></div><form id="editor"><div id="fields"></div><div class="actions"><button type="submit">发布本条修改</button><button id="reset-item" type="button" class="secondary">恢复本条原始预设</button></div></form></section>
<section><h2>更新界面</h2><p>上传与当前工具数据结构兼容的完整 index.html。保留已有提示词修改；新产品、场景编号或引擎结构变更，请通过源码部署并同步 defaults.json。系统会检查脚本语法，发布后仍需查看公开页面确认效果。</p><input id="interface-file" type="file" accept=".html,text/html" aria-label="选择新版界面 HTML"><button id="publish-interface" type="button">上传并发布新版界面</button></section>
<section><h2>历史版本</h2><p>每次发布前自动保留当前完整界面与提示词。回退同时恢复两者，回退前也会保存当前版本。</p><label for="history">选择回退目标（UTC 时间）</label><select id="history"></select><button id="rollback" type="button" class="secondary">回退到所选版本</button></section>
</div></main></body></html>
