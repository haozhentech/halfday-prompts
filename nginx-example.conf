# Example for a NEW standalone static website.
# Replace both placeholders before enabling. Keep existing websites unchanged.
server {
    listen 80;
    server_name YOUR_DOMAIN;
    root /YOUR/WEB/ROOT/halfday;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
}
# Configure HTTPS through your hosting panel or existing certificate setup.
